which-replic-info: "{!ENV: MERRITT_REPLIC_INFO !DEFAULT: replic-info-docker}"
  
replic-info-docker: &docker
  service:
    threadPool: "5"
    queueCapacity: 15
    nodePath: "yaml:2"
    replicQualify: "NONE"
    
  state:
    id: replic
    name: UC3
    description: "UC3 replic micro-service"
    version: "replic version"
    serviceScheme: "Replic/1.0"
    
  cleanup:
    subject: "Merritt Replication Cleanup Stage"
    from: "uc3staff@ucop.edu"
    to: "NONE"
    msg: "Merritt Replication Cleanup Stage"

  fileLogger:
    messageMaximumLevel: 5
    messageMaximumError: 10
    path: /tdr/tmpdir
    name: inv
    qualifier: yyMMdd
    trace: 5

  db:
    adapter: mysql2
    host: db-container
    name: inv
    user: user
    password: password
    encoding: "characterEncoding=UTF-8&characterSetResults=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"

  scan:
    # reset this value after fix to scan process
    # maxkeys: 500
    maxkeys: 500
    threadSleep: 100
    # ignore items less than 5 min old
    currentDateDelta: 300000
    
inv-ecs: 
  <<: *docker

  db:
    user: "{!SSM: inv/readwrite/db-user}"
    password: "{!SSM: inv/readwrite/db-password}"
    host: "{!SSM: inv/db-host}"
    name: "{!SSM: inv/db-name}"
    encoding: "{!ENV: RDS_ENCODING !DEFAULT: characterEncoding=UTF-8&characterSetResults=UTF-8}"

